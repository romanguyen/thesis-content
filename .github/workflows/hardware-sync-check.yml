name: Hardware Sync Check

on:
  pull_request:
    branches: ["main"]

jobs:
  verify-hardware-generated-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Regenerate hardware pages
        run: php scripts/git_hardware_sync.php --source=scripts/hardware_clusters.json --out-en=scripts/generated/hardware_git_sync.en.txt --out-cs=scripts/generated/hardware_git_sync.cs.txt

      - name: Ensure generated pages are committed
        run: git diff --exit-code -- scripts/generated/hardware_git_sync.en.txt scripts/generated/hardware_git_sync.cs.txt
